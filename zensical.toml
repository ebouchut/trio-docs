# TODO: Document and add link
[project.markdown_extensions.abbr]

# Allow for rendering info-like boxes (aka. call-outs) 
# with a title, body, specific icon and color.
#
# https://facelessuser.github.io/pymdown-extensions/extensions/blocks/plugins/admonition/
[project.markdown_extensions.admonition]

# supercharges the Admonition extension, making the resulting call-outs 
# collapsible, allowing them to be opened and closed by the user. 
#
# https://zensical.org/docs/setup/extensions/python-markdown-extensions/#details
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.attr_list]

# TODO: Document and add link
[project.markdown_extensions.def_list]

# TODO: Document and add link
[project.markdown_extensions.md_in_html]

# Allow for rendering of block and inline block equations 
# and integrates seamlessly with MathJax (a library for mathematical typesetting).
# 
# https://zensical.org/docs/setup/extensions/python-markdown-extensions/#arithmatex
[project.markdown_extensions.pymdownx.arithmatex]
generic = true

# Inline bundled and custom icons and emojis in *.svg file format 
# into the resulting HTML page
# 
# https://zensical.org/docs/setup/extensions/python-markdown-extensions/#emoji
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
options.custom_icons = [ "overrides/.icons" ]

# Add support for syntax highlighting of code blocks.
# 
# https://zensical.org/docs/setup/extensions/python-markdown-extensions/#highlight
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans  = "__span"
pygments_lang_class = true
linenums_style = "pymdownx-inline"

# Add support for syntax highlighting of inline code blocks.
#
# https://zensical.org/docs/setup/extensions/python-markdown-extensions/#inlinehilite
[project.markdown_extensions.pymdownx.inlinehilite]

# Add a simple syntax to allow for the rendering of keyboard keys and combinations, 
# e.g. Ctrl+Alt+Del.
#
# https://zensical.org/docs/setup/extensions/python-markdown-extensions/#keys
[project.markdown_extensions.pymdownx.keys]

# Convert some sequences of characters into their corresponding symbols, 
# e.g. copyright symbols or fractions.
#
# https://zensical.org/docs/setup/extensions/python-markdown-extensions/#smartsymbols
[project.markdown_extensions.pymdownx.smartsymbols]

# Add the ability to embed content from arbitrary files into a document, 
# including other documents or source files,
#
# https://zensical.org/docs/setup/extensions/python-markdown-extensions/#snippets
[project.markdown_extensions.pymdownx.snippets]
auto_append = [ "includes/glossary.txt" ]

# Allow for arbitrary nesting of code and content blocks inside each other,
# including admonitions, tabs, lists and all other elements.
#
# https://zensical.org/docs/setup/extensions/python-markdown-extensions/#superfences
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

# Allow the usage of content tabs, a simple way to group related content 
# and code blocks under accessible tabs.
# 
# https://zensical.org/docs/setup/extensions/python-markdown-extensions/#tabbed
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tabbed.slugify]
object = "pymdownx.slugs.slugify"
kwds = { case = "lower" }
