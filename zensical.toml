# ============================================================================
# Trio-docs configuration file
# ============================================================================

[project]

# The site_name is shown in the page header and the browser window title
#
# Read more: https://zensical.org/docs/setup/basics/#site_name
site_name = "TrioDocs"

# The site_description is included in the HTML head and should contain a
# meaningful description of the site content for use by search engines.
#
# Read more: https://zensical.org/docs/setup/basics/#site_description
site_description = "Documentation of Trio, an Automated Insulin Delivery system for iOS."

# The site_author attribute. This is used in the HTML head element.
#
# Read more: https://zensical.org/docs/setup/basics/#site_author
site_author = "Trio Community"


# Controls the directory structure of your documentation site, 
# and thereby the URL format used for linking to pages.
# 
# Read more: https://zensical.org/docs/setup/basics/#use_directory_urls
use_directory_urls = "!ENV [CHECK_BROKEN_LINKS, True]"

# The site_url is the canonical URL for your site. When building online
# documentation you should set this.
# Read more: https://zensical.org/docs/setup/basics/#site_url
site_url = "https://triodocs.org/"

# The copyright notice appears in the page footer and can contain an HTML
# fragment.
#
# Read more: https://zensical.org/docs/setup/basics/#copyright
copyright = """
Copyright &copy; 2025 Trio Community
"""

# ~~~~~~~~~~~~~~~~~~~
# GitHub Repository
# ~~~~~~~~~~~~~~~~~~~
repo_name = "nightscout/trio-docs"

# In order to display a link to the repository of your project as part of your documentation.
# The link to the repository will be rendered next to the search bar on big screens. Additionally, for public repositories hosted on GitHub or GitLab, the latest release tag1, 
# as well as the number of stars and forks, are automatically requested and rendered.
#
# Read more: https://zensical.org/docs/setup/repository/#configuration
repo_url = "https://github.com/nightscout/trio-docs/"

# Configure the edit URL to use the the dev branch 
#
# Read more: https://zensical.org/docs/setup/repository/#edit_uri
edit_uri = "edit/dev/docs/"

